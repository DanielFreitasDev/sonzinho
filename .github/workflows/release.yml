# A cada push na main, publica a release v<versionName> (de app/build.gradle.kts) com o APK,
# se ela ainda não existir. A tag é criada pelo próprio GitHub junto com a release.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Uma execução por vez: duas não disputam a criação da mesma release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ver se a versão já foi publicada
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6.1.0
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.version.outputs.exists == 'false'

      - name: Instalar SDK e NDK do Android
        if: steps.version.outputs.exists == 'false'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Testes
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew test --no-daemon

      - name: Compilar APK de release
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "sonzinho-${TAG}.apk"
          sha256sum "sonzinho-${TAG}.apk" > "sonzinho-${TAG}.apk.sha256"
          gh release create "$TAG" "sonzinho-${TAG}.apk" "sonzinho-${TAG}.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Sonzinho ${TAG}" \
            --notes-file .github/release-notes.md

  # Publica o APK da release no GitHub Packages (registro Maven: dev.danielfreitas:sonzinho, tipo apk).
  package:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: github

      - name: Publicar package
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "$TAG" --pattern "sonzinho-${TAG}.apk"
          set +e
          mvn -B --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DgroupId=dev.danielfreitas -DartifactId=sonzinho -Dversion="$VERSION" -Dpackaging=apk \
            -Dfile="sonzinho-${TAG}.apk" -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          # Versões publicadas não podem ser sobrescritas: se já existe, está tudo certo.
          if [ "$status" -ne 0 ] && grep -q "409" deploy.log; then
            echo "Package ${VERSION} já publicado."
            exit 0
          fi
          exit "$status"
