[versions]
# Versões estáveis conferidas em 2026-10-25 (Google Maven, Maven Central e Gradle Plugin Portal).
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
hiltAndroidx = "1.4.0"
datastore = "1.3.0"
room3 = "3.0.3"
sqlite = "2.7.1"
coroutines = "1.11.0"
serialization = "1.12.0"
oboe = "1.11.0"
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
robolectric = "4.17"
turbine = "1.2.1"
detekt = "1.23.8"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
composeRulesDetekt = "0.6.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
