# Gera o APK e publica uma release no GitHub ao enviar uma tag "v*" (ex.: v1.0.0).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Instalar SDK e NDK do Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Testes
        run: ./gradlew test --no-daemon

      - name: Compilar APK de release
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "sonzinho-${TAG}.apk"
          sha256sum "sonzinho-${TAG}.apk" > "sonzinho-${TAG}.apk.sha256"
          gh release create "$TAG" "sonzinho-${TAG}.apk" "sonzinho-${TAG}.apk.sha256" \
            --title "Sonzinho ${TAG}" \
            --notes-file .github/release-notes.md
